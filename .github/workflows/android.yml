name: Build Yazi APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate Yazı launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 432x432 xc:'#303030' -fill '#D32F2F' -font DejaVu-Sans-Bold -pointsize 115 -gravity center -annotate +0+0 'Yazı' app/src/main/res/mipmap-xxxhdpi/icon.png
      - name: Build
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Yazi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yazi
          path: Yazi.apk
